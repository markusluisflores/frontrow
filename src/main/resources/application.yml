spring:
  application:
    name: frontrow
  ai:
    mcp:
      server:
        name: frontrow
        protocol: STREAMABLE
        type: SYNC
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.batch_size: 0

frontrow:
  hold-ttl: 10m
  max-active-hold-groups: 3
  max-seats-per-hold: 8
  lock-timeout: 5s
